<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#342f44">
    <title>Montana | البحث</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="stylesheet" href="dark-theme.css">
    <link rel="stylesheet" href="shop-premium.css?v=2">
</head>
<body class="mnt-shop">

<div class="page-header">
    <a href="index.html" class="page-back"><i class="fas fa-arrow-right"></i></a>
    <h2>البحث</h2>
    <div class="page-header-actions"></div>
</div>

<div class="search-page">
    <div class="srch-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="ابحث عن منتجات، ماركات..." autofocus id="searchInput">
        <button class="srch-clear" onclick="document.getElementById('searchInput').value=''"><i class="fas fa-times"></i></button>
    </div>

    <!-- Recent Searches -->
    <div class="srch-section" id="recentSearches">
        <div class="srch-section-header">
            <h3>عمليات بحث سابقة</h3>
            <button class="srch-clear-all">مسح الكل</button>
        </div>
        <div class="srch-tags">
            <a href="/product/acne-facial-cleanser" class="srch-tag"><i class="fas fa-clock"></i> غسول حب الشباب</a>
            <a href="/product/whitening-cream" class="srch-tag"><i class="fas fa-clock"></i> كريم تفتيح</a>
            <a href="/product/hand-body-lotion" class="srch-tag"><i class="fas fa-clock"></i> لوشن الجسم</a>
            <a href="/product/post-laser-cream" class="srch-tag"><i class="fas fa-clock"></i> كريم الليزر</a>
        </div>
    </div>

    <!-- Trending -->
    <div class="srch-section">
        <h3>الأكثر بحثاً <i class="fas fa-fire" style="color:#EF5350"></i></h3>
        <div class="srch-trending">
            <a href="/product/whitening-cleanser" class="srch-trend-item">
                <span class="srch-rank">1</span>
                <span>غسول التفتيح والتوحيد</span>
                <i class="fas fa-arrow-trend-up" style="color:#27ae60"></i>
            </a>
            <a href="/product/whitening-cream" class="srch-trend-item">
                <span class="srch-rank">2</span>
                <span>كريم التفتيح بالألفا أربوتين</span>
                <i class="fas fa-arrow-trend-up" style="color:#27ae60"></i>
            </a>
            <a href="/product/acne-facial-cleanser" class="srch-trend-item">
                <span class="srch-rank">3</span>
                <span>غسول حب الشباب</span>
                <i class="fas fa-minus" style="color:#999"></i>
            </a>
            <a href="/product/anti-scar-gel" class="srch-trend-item">
                <span class="srch-rank">4</span>
                <span>جل علاج الندبات</span>
                <i class="fas fa-arrow-trend-up" style="color:#27ae60"></i>
            </a>
            <a href="/product/hand-body-lotion" class="srch-trend-item">
                <span class="srch-rank">5</span>
                <span>لوشن اليدين والجسم</span>
                <i class="fas fa-arrow-trend-down" style="color:#EF5350"></i>
            </a>
        </div>
    </div>

    <!-- Popular Categories -->
    <div class="srch-section">
        <h3>أقسام شائعة</h3>
        <div class="srch-cats">
            <a href="category.html" class="srch-cat-chip"><i class="fas fa-spa"></i> العناية بالبشرة</a>
        </div>
    </div>

    <!-- Live results -->
    <div class="srch-section" id="searchResults" style="display:none">
        <h3>نتائج البحث <span id="resultsCount"></span></h3>
        <div id="resultsList"></div>
    </div>
</div>

<script src="components.js"></script>
<script src="js/cart.js"></script>
<script type="module">
import { products as productsApi } from '/js/store-api.js';
import { localizeProduct, formatPrice, getLocale } from '/js/i18n/locale.js?v=3';
import { UI_STRINGS } from '/js/i18n/en.js';

const SEARCH_UI = getLocale() === 'en' ? UI_STRINGS.search : {
  noResults: 'لا توجد نتائج',
  results: 'نتائج البحث',
};

const RECENT_KEY = 'montana_recent_searches';
const input = document.getElementById('searchInput');
const resultsEl = document.getElementById('searchResults');
const resultsList = document.getElementById('resultsList');
const resultsCount = document.getElementById('resultsCount');
let allProducts = [];
let debounce;

function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
}
function saveRecent(q) {
  let r = loadRecent().filter(x => x !== q);
  r.unshift(q);
  r = r.slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(r));
  renderRecent();
}
function renderRecent() {
  const tags = document.querySelector('#recentSearches .srch-tags');
  if (!tags) return;
  const recent = loadRecent();
  if (!recent.length) { document.getElementById('recentSearches').style.display = 'none'; return; }
  tags.innerHTML = recent.map(q => {
    const safe = String(q).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return `<a href="#" class="srch-tag" data-q="${safe}"><i class="fas fa-clock"></i> ${safe}</a>`;
  }).join('');
  tags.querySelectorAll('.srch-tag').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); input.value = a.dataset.q; runSearch(a.dataset.q); });
  });
}
document.querySelector('.srch-clear-all')?.addEventListener('click', () => {
  localStorage.removeItem(RECENT_KEY);
  renderRecent();
});

function runSearch(q) {
  q = (q || '').trim().toLowerCase();
  if (q.length < 2) { resultsEl.style.display = 'none'; return; }
  const hits = allProducts.filter(p =>
    (p.name || '').toLowerCase().includes(q) ||
    (p.name_en || '').toLowerCase().includes(q) ||
    (p.description || '').toLowerCase().includes(q)
  );
  resultsCount.textContent = `(${hits.length})`;
  resultsList.innerHTML = hits.length ? hits.map(p => {
    const lp = localizeProduct(p) || p;
    return `
    <a href="/product/${p.slug}" class="srch-trend-item">
      <img src="${lp.image_url}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover">
      <span>${lp.name}</span>
      <strong style="margin-inline-start:auto;color:var(--accent)">${formatPrice(p.price)}</strong>
    </a>`;
  }).join('') : `<p style="padding:16px;color:var(--text-muted);text-align:center">${SEARCH_UI.noResults}</p>`;
  resultsEl.style.display = '';
  saveRecent(q);
}

input.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => runSearch(input.value), 250);
});

allProducts = await productsApi.list();
renderRecent();
if (input.value.trim()) runSearch(input.value);
</script>
</body>
</html>
