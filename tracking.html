<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#9B6CB8">
    <title>Montana | تتبع الطلب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="stylesheet" href="dark-theme.css">
    <style>
        .trk-lookup { padding:16px 20px; }
        .trk-lookup-form { display:flex; flex-direction:column; gap:10px; }
        .trk-lookup-form input { padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font-family:'Tajawal',sans-serif; }
        .trk-lookup-form button { padding:12px; border:none; border-radius:12px; background:var(--accent,#9B6CB8); color:#fff; font-weight:700; cursor:pointer; }
        .trk-err { color:#EF5350; font-size:13px; text-align:center; padding:8px; display:none; }
        .trk-empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
        .trk-pay-badge { display:inline-block; font-size:11px; padding:4px 10px; border-radius:20px; margin-top:8px; }
        .trk-pay-awaiting { background:rgba(212,175,55,.15); color:#D4AF37; }
        .trk-pay-confirmed { background:rgba(39,174,96,.12); color:#27ae60; }
        .trk-proof { padding:16px; border:1.5px dashed var(--border); border-radius:14px; text-align:center; margin:0 20px 16px; }
        .trk-proof p { margin:0 0 10px; font-size:13px; color:var(--text-muted); }
        .trk-proof label { display:inline-block; padding:10px 20px; border-radius:12px; background:var(--accent,#9B6CB8); color:#fff; font-weight:700; cursor:pointer; font-size:14px; }
        .trk-proof label.disabled { opacity:.55; cursor:not-allowed; pointer-events:none; }
        .trk-proof input[type=file] { display:none; }
        .trk-proof .trk-proof-msg { font-size:13px; margin-top:8px; }
        .trk-proof .trk-proof-msg.ok { color:#27ae60; }
        .trk-proof .trk-proof-msg.err { color:#EF5350; }
    </style>
</head>
<body>

<div class="page-header">
    <a href="index.html" class="page-back"><i class="fas fa-arrow-right"></i></a>
    <h2>تتبع الطلب</h2>
    <div class="page-header-actions"></div>
</div>

<div class="trk-lookup">
    <form class="trk-lookup-form" id="lookupForm">
        <input type="text" id="orderNumber" placeholder="رقم الطلب (MON-XXXXX)" dir="ltr" required>
        <input type="tel" id="orderPhone" placeholder="رقم الهاتف المستخدم في الطلب" dir="ltr" required>
        <button type="submit"><i class="fas fa-search"></i> عرض حالة الطلب</button>
    </form>
    <p class="trk-err" id="lookupErr"></p>
</div>

<div class="tracking-page" id="trackingResult" style="display:none"></div>

<script src="components.js"></script>
<script src="js/cart.js"></script>
<script type="module">
import { orders as ordersApi } from '/js/store-api.js';

const STATUS_LABELS = {
  pending: 'قيد الانتظار',
  confirmed: 'تم تأكيد الطلب',
  preparing: 'جاري تجهيز الطلب',
  shipped: 'تم الشحن — في الطريق',
  delivered: 'تم التوصيل',
  cancelled: 'ملغي'
};
const PAYMENT_LABELS = { cod: 'الدفع عند الاستلام', wallet: 'محفظة / إنستاباي', card: 'بطاقة ائتمان' };
const PAYMENT_STATUS = { pending: 'بانتظار الدفع', awaiting_review: 'بانتظار مراجعة الإيصال', confirmed: 'تم تأكيد الحجز' };

const STEPS = ['pending', 'confirmed', 'preparing', 'shipped', 'delivered'];
const STEP_ICONS = { pending: 'fa-check', confirmed: 'fa-check', preparing: 'fa-box', shipped: 'fa-truck', delivered: 'fa-home' };

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
}

function stepState(status, step) {
  const si = STEPS.indexOf(status === 'cancelled' ? 'pending' : status);
  const ti = STEPS.indexOf(step);
  if (status === 'cancelled') return 'pending';
  if (ti < si) return 'done';
  if (ti === si) return 'active';
  return 'pending';
}

function renderOrder(data) {
  const el = document.getElementById('trackingResult');
  el.style.display = '';
  const status = data.status || 'pending';
  const payBadge = data.payment_status === 'confirmed'
    ? `<span class="trk-pay-badge trk-pay-confirmed"><i class="fas fa-check-circle"></i> ${PAYMENT_STATUS.confirmed}</span>`
    : (data.payment_status === 'awaiting_review'
      ? `<span class="trk-pay-badge trk-pay-awaiting"><i class="fas fa-clock"></i> ${PAYMENT_STATUS.awaiting_review}</span>`
      : '');

  const proofHtml = (data.payment_status === 'pending') ? `
    <div class="trk-proof" id="proofBox">
      <p>لسه محولتيش مقدّم الحجز؟ ارفعي صورة الإيصال هنا وهنراجعها 💜</p>
      <label for="proofFile" id="proofLabel"><i class="fas fa-camera"></i> ارفعي صورة الإيصال</label>
      <input type="file" id="proofFile" accept="image/*">
      <div class="trk-proof-msg" id="proofMsg"></div>
    </div>` : '';

  const itemsHtml = (data.items || []).map(it => `
    <div class="conf-item">
      <img src="${it.product_image || ''}" alt="" onerror="this.style.display='none'">
      <div><h4>${it.product_name}</h4><span>x${it.quantity}</span></div>
      <span class="conf-item-price">${Math.round(it.total || 0)} ج.م</span>
    </div>`).join('');

  const timeline = STEPS.map(step => {
    const st = stepState(status, step);
    return `<div class="trk-step ${st}">
      <div class="trk-dot">${st === 'done' ? '<i class="fas fa-check"></i>' : (st === 'active' ? `<i class="fas ${STEP_ICONS[step]}"></i>` : STEPS.indexOf(step) + 1)}</div>
      <div class="trk-step-info">
        <strong>${STATUS_LABELS[step]}</strong>
        <span>${st === 'active' || st === 'done' ? fmtDate(data.created_at) : ''}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="trk-order-num">
      <span>رقم الطلب</span>
      <strong>${data.order_number}</strong>
      ${payBadge}
    </div>
    <div class="trk-status-card">
      <div class="trk-icon"><i class="fas fa-${status === 'delivered' ? 'check-circle' : status === 'shipped' ? 'truck' : 'box'}"></i></div>
      <h3>${STATUS_LABELS[status] || status}</h3>
      <p>${status === 'cancelled' ? 'تم إلغاء هذا الطلب' : 'آخر تحديث: ' + fmtDate(data.created_at)}</p>
    </div>
    <div class="trk-timeline">${timeline}</div>
    ${proofHtml}
    <div class="trk-details">
      <h3>تفاصيل التوصيل</h3>
      <div class="trk-detail-row"><i class="fas fa-map-marker-alt"></i><span>${data.address || ''}${data.city ? '، ' + data.city : ''}${data.governorate ? ' — ' + data.governorate : ''}</span></div>
      <div class="trk-detail-row"><i class="fas fa-phone"></i><span dir="ltr">${data.customer_phone || ''}</span></div>
      <div class="trk-detail-row"><i class="fas fa-money-bill-wave"></i><span>${PAYMENT_LABELS[data.payment_method] || data.payment_method} — ${Math.round(data.total || 0)} ج.م</span></div>
    </div>
    <div class="trk-items">
      <h3>المنتجات (${(data.items || []).length})</h3>
      ${itemsHtml || '<p class="trk-empty">لا توجد تفاصيل</p>'}
    </div>
    <div class="trk-help"><a href="contact.html"><i class="fas fa-headset"></i> هل تحتاج مساعدة؟ تواصل معنا</a></div>`;

  const proofInput = document.getElementById('proofFile');
  if (proofInput) {
    proofInput.addEventListener('change', () => uploadProof(data.order_number, data.customer_phone));
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadProof(orderNumber, phone) {
  const input = document.getElementById('proofFile');
  const label = document.getElementById('proofLabel');
  const msgEl = document.getElementById('proofMsg');
  const file = input.files[0];
  if (!file) return;
  if (file.size > 4_000_000) {
    msgEl.textContent = 'الصورة كبيرة أوي، جرّبي صورة أصغر من 4 ميجا';
    msgEl.className = 'trk-proof-msg err';
    return;
  }
  // Disable the picker while a request is in flight — it stayed clickable
  // before, so re-picking a file mid-upload could race two uploads against
  // the same order.
  label?.classList.add('disabled');
  input.disabled = true;
  msgEl.textContent = 'بترفع الصورة...';
  msgEl.className = 'trk-proof-msg';
  try {
    const base64 = await fileToBase64(file);
    const res = await fetch('/api/send-telegram', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: AbortSignal.timeout(25000),
      body: JSON.stringify({
        attach_proof: true,
        order_number: orderNumber,
        phone,
        customer_phone: phone,
        proof_base64: base64,
        proof_mime: file.type || 'image/jpeg',
      }),
    });
    const result = await res.json();
    if (!result.ok) {
      msgEl.textContent = 'حصلت مشكلة، حاولي تاني 🙏';
      msgEl.className = 'trk-proof-msg err';
      label?.classList.remove('disabled');
      input.disabled = false;
      return;
    }
    msgEl.textContent = 'تمام! ✅ استلمنا الصورة وهنراجعها قريب';
    msgEl.className = 'trk-proof-msg ok';
    const fresh = await ordersApi.getStatus(orderNumber, phone);
    if (fresh.found) {
      lastSignature = statusSignature(fresh);
      renderOrder(fresh);
    }
  } catch (e) {
    msgEl.textContent = e?.name === 'AbortError' ? 'الاتصال بطيء، حاولي تاني' : 'تعذّر رفع الصورة، حاولي تاني';
    msgEl.className = 'trk-proof-msg err';
    label?.classList.remove('disabled');
    input.disabled = false;
  }
}

// Auto-refresh while the page is open — an admin confirming the order (or
// the courier updating its status) happens server-side with no way to push
// to the browser, so we poll instead of asking the customer to reload.
let pollTimer = null;
let lastSignature = null;

function statusSignature(data) {
  return `${data.status}|${data.payment_status}|${data.updated_at || ''}`;
}

function startPolling(orderNumber, phone) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const fresh = await ordersApi.getStatus(orderNumber, phone);
      if (!fresh.found) return;
      const sig = statusSignature(fresh);
      if (sig !== lastSignature) {
        lastSignature = sig;
        renderOrder(fresh);
      }
    } catch { /* transient network error — try again next tick */ }
  }, 10_000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
});

document.getElementById('lookupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('lookupErr');
  errEl.style.display = 'none';
  const orderNumber = document.getElementById('orderNumber').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  try {
    const data = await ordersApi.getStatus(orderNumber, phone);
    if (!data.found) {
      errEl.textContent = 'لم نجد طلباً بهذا الرقم والهاتف. تأكد من البيانات.';
      errEl.style.display = 'block';
      document.getElementById('trackingResult').style.display = 'none';
      return;
    }
    lastSignature = statusSignature(data);
    renderOrder(data);
    sessionStorage.setItem('montana_track', JSON.stringify({ orderNumber, phone }));
    startPolling(orderNumber, phone);
  } catch {
    errEl.textContent = 'تعذّر البحث، حاول مرة أخرى';
    errEl.style.display = 'block';
  }
});

// Auto-load from sessionStorage or URL params
(async () => {
  const params = new URLSearchParams(location.search);
  let orderNumber = params.get('order') || params.get('order_number');
  let phone = params.get('phone');
  if (!orderNumber || !phone) {
    try {
      const saved = JSON.parse(sessionStorage.getItem('montana_track'));
      orderNumber = saved?.orderNumber;
      phone = saved?.phone;
    } catch { /* ignore */ }
  }
  if (!orderNumber || !phone) {
    try {
      const last = JSON.parse(sessionStorage.getItem('montana_last_order'));
      orderNumber = last?.order?.order_number;
      phone = last?.order?.customer_phone;
    } catch { /* ignore */ }
  }
  if (orderNumber && phone) {
    document.getElementById('orderNumber').value = orderNumber;
    document.getElementById('orderPhone').value = phone;
    document.getElementById('lookupForm').requestSubmit();
  }
})();
</script>
</body>
</html>
