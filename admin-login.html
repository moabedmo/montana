<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montana | تسجيل دخول لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<style>
:root{--purple:#9B6CB8;--dark:#2D1B3D;--gold:#D4AF37;}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Tajawal',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 0%,rgba(155,108,184,.25),transparent 45%),
             radial-gradient(circle at 85% 100%,rgba(212,175,55,.15),transparent 45%),
             var(--dark);
  padding:20px;
}
.box{
  width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:36px 30px;backdrop-filter:blur(10px);
}
.logo{text-align:center;margin-bottom:26px}
.logo img{height:44px}
.logo h1{color:#fff;font-size:20px;letter-spacing:.06em;margin-top:8px}
.logo span{color:var(--gold)}
.sub{color:rgba(255,255,255,.55);font-size:12px;text-align:center;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:14px;
}
.field input:focus{outline:none;border-color:var(--purple)}
.submit{
  width:100%;padding:13px;border-radius:10px;border:none;margin-top:6px;
  background:linear-gradient(135deg,var(--purple),#7d53a0);color:#fff;font-weight:700;font-size:14px;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit:disabled{opacity:.6;cursor:default}
.err{color:#F0997B;font-size:12px;margin-top:12px;text-align:center;display:none}
.back{display:block;text-align:center;margin-top:20px;color:rgba(255,255,255,.4);font-size:12px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <img src="images/logo.png" alt="Montana" onerror="this.style.display='none'">
    <h1>MONTANA<span>.</span></h1>
  </div>
  <p class="sub">لوحة تحكم المتجر — للإدارة فقط</p>
  <form id="loginForm">
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" dir="ltr" required autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" dir="ltr" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit" id="submitBtn"><i class="fas fa-lock"></i> تسجيل الدخول</button>
    <p class="err" id="err"></p>
  </form>
  <a href="index.html" class="back">← الرجوع للموقع</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://ikryeyqrithikabwidov.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrcnlleXFyaXRoaWthYndpZG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MzY1ODcsImV4cCI6MjA5NzMxMjU4N30.kNfHPxV4fq67cOF8uFsTrLOxPYcLcmmDO3ScIHzI9Uo';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// already logged in as a verified admin? skip straight to the dashboard.
const { data: { session } } = await sb.auth.getSession();
if (session) {
  const [{ data: isAdmin }, { data: isOwner }] = await Promise.all([
    sb.rpc('is_store_admin'),
    sb.rpc('is_owner'),
  ]);
  if (isAdmin || isOwner) location.href = 'admin.html';
}

const form = document.getElementById('loginForm');
const err = document.getElementById('err');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الدخول…';
  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error: authErr } = await sb.auth.signInWithPassword({ email, password });
    if (authErr) throw new Error('البريد أو كلمة المرور غير صحيحة');

    const [{ data: isAdmin, error: rpcErr }, { data: isOwner }] = await Promise.all([
      sb.rpc('is_store_admin'),
      sb.rpc('is_owner'),
    ]);
    if (rpcErr || (!isAdmin && !isOwner)) {
      await sb.auth.signOut();
      throw new Error('هذا الحساب غير مصرّح له بالدخول للوحة التحكم');
    }
    location.href = 'admin.html';
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> تسجيل الدخول';
  }
});
</script>
</body>
</html>
