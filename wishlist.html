<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#9B6CB8">
    <title>Montana | المفضلة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="stylesheet" href="dark-theme.css">
</head>
<body>

<div class="page-header">
    <a href="index.html" class="page-back"><i class="fas fa-arrow-right"></i></a>
    <h2>المفضلة</h2>
    <div class="page-header-actions"></div>
</div>

<div class="cat-toolbar"><span class="cat-count" id="wishCount">…</span></div>
<div class="products-grid" id="wishGrid" style="padding:16px"></div>

<script src="components.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/storefront-ui.js"></script>
<script type="module">
import { products as productsApi } from '/js/store-api.js';

const grid = document.getElementById('wishGrid');
const countEl = document.getElementById('wishCount');

async function render() {
  const ids = window.Wishlist.getIds();
  if (!ids.length) {
    countEl.textContent = '0 منتجات';
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-muted)">
      <i class="far fa-heart" style="font-size:40px;margin-bottom:12px;display:block;opacity:.4"></i>
      قائمة المفضلة فارغة<br><a href="category.html" style="color:var(--accent);font-weight:700">تصفح المنتجات</a>
    </div>`;
    return;
  }
  const all = await productsApi.list();
  const list = all.filter(p => ids.includes(p.id));
  countEl.textContent = `${list.length} منتجات`;
  if (!list.length) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">المنتجات المحفوظة لم تعد متاحة</p>';
    return;
  }
  grid.innerHTML = list.map(p => window.MontanaUI.renderProductCard(p)).join('');
  window.MontanaUI.initProductCards(grid);
}

render();
</script>
<script type="module" src="js/site-settings.js"></script>
</body>
</html>
