<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#9B6CB8">
    <title>Montana | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../app.css">
    <link rel="stylesheet" href="../pages.css">
    <link rel="stylesheet" href="../premium.css">
    <link rel="stylesheet" href="../css/ltr-en.css?v=1">
    <link rel="stylesheet" href="../dark-theme.css">
    <script src="../js/seo.js" defer></script>
</head>
<body class="mnt-en">

<div class="page-header">
    <a href="/en/index.html" class="page-back"><i class="fas fa-arrow-left"></i></a>
    <h2>Sign In</h2>
    <div class="page-header-actions"></div>
</div>

<div class="auth-page">
    <div class="auth-logo">
        <img src="../images/logo.png" alt="Montana">
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
        <button class="auth-tab active" onclick="showAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="showAuthTab('register')">New account</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="loginForm">
        <div class="form-group">
            <label>Email or phone number</label>
            <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" id="loginIdentifier" placeholder="example@email.com" dir="ltr">
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="••••••••" dir="ltr">
                <button type="button" class="input-toggle" onclick="togglePassword(this)"><i class="far fa-eye"></i></button>
            </div>
        </div>
        <div class="auth-options">
            <label class="auth-remember"><input type="checkbox" checked> Remember me</label>
            <a href="#" class="auth-forgot" id="forgotPasswordLink">Forgot your password?</a>
        </div>
        <button type="submit" class="auth-submit" id="loginSubmitBtn">Sign In</button>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="auth-social google" data-oauth="google">
            <i class="fab fa-google"></i> Continue with Google
        </button>
        <button type="button" class="auth-social facebook" data-oauth="facebook">
            <i class="fab fa-facebook-f"></i> Continue with Facebook
        </button>
        <button type="button" class="auth-social apple" data-oauth="apple">
            <i class="fab fa-apple"></i> Continue with Apple
        </button>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="registerForm" style="display:none">
        <div class="form-group">
            <label>Full name</label>
            <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" id="regName" placeholder="Enter your name">
            </div>
        </div>
        <div class="form-group">
            <label>Phone number</label>
            <div class="input-icon">
                <i class="fas fa-phone"></i>
                <input type="tel" id="regPhone" placeholder="01xxxxxxxxx" dir="ltr">
            </div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="example@email.com" dir="ltr">
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword" placeholder="At least 6 characters" dir="ltr">
                <button type="button" class="input-toggle" onclick="togglePassword(this)"><i class="far fa-eye"></i></button>
            </div>
        </div>
        <div class="form-group">
            <label>Confirm password</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword2" placeholder="Re-enter the password" dir="ltr">
            </div>
        </div>
        <label class="auth-terms"><input type="checkbox" id="registerTerms"> I agree to <a href="/en/privacy.html">Privacy policy</a> and <a href="/en/terms.html">Terms & conditions</a></label>
        <button type="submit" class="auth-submit" id="registerSubmitBtn">Create account</button>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="auth-social google" data-oauth="google">
            <i class="fab fa-google"></i> Sign up with Google
        </button>
    </form>
</div>

<script>
function showAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
    event.target.classList.add('active');
}
function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input');
    const icon = btn.querySelector('i');
    if (input.type === 'password') { input.type = 'text'; icon.className = 'far fa-eye-slash'; }
    else { input.type = 'password'; icon.className = 'far fa-eye'; }
}
</script>
<script type="module">
import { sb, auth as authApi } from '/js/store-api.js';

const err = (msg) => { alert(msg); };

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginIdentifier').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return err('Enter your email and password');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return err(error.message === 'Invalid login credentials' ? 'Incorrect sign-in details' : error.message);
  location.href = 'account.html';
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!document.getElementById('registerTerms').checked) return err('You must accept the terms');
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  if (!name || !email || !password) return err('Please complete the required fields');
  if (password.length < 6) return err('Password At least 6 characters');
  if (password !== password2) return err('The two passwords do not match');
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name, phone } } });
  if (error) return err(error.message);
  if (data.session) {
    try { await authApi.upsertProfile(name, phone); } catch { /* non-fatal */ }
    location.href = 'account.html';
  } else {
    alert('Account created — check your email if confirmation is required, then sign in');
    showAuthTab('login');
  }
});

document.getElementById('forgotPasswordLink')?.addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginIdentifier').value.trim();
  if (!email || !email.includes('@')) return err('Enter your email address first');
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: `${location.origin}/login.html`
  });
  if (error) return err(error.message);
  alert('A password reset link has been sent to your email');
});

document.querySelectorAll('[data-oauth]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const provider = btn.dataset.oauth;
    const { error } = await sb.auth.signInWithOAuth({
      provider,
      options: { redirectTo: `${location.origin}/account.html` }
    });
    if (error) err(error.message === 'Provider not enabled' ? 'Enable the provider ' + provider + ' from the Supabase dashboard first' : error.message);
  });
});
</script>

<script>window.MONTANA_LOCALE="en";</script>
<script type="module" src="../js/i18n/bootstrap-en.js"></script>
<script type="module" src="../js/en-apply-ui.js"></script>
<script src="../components.js"></script>
<script src="../js/lang-switch.js?v=2"></script>
<script src="../js/cart.js"></script>
<script type="module" src="../js/site-settings.js"></script>
</body>
</html>
