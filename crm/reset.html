<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Montana CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:#231840;color:rgba(255,255,255,.92);font-family:'Jost',sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,rgba(167,139,250,.18),transparent 45%),radial-gradient(circle at 80% 80%,rgba(201,168,76,.12),transparent 40%),#231840;}
.wrap{width:400px;max-width:95vw;}
.logo{text-align:center;margin-bottom:40px;}
.logo h1{font-family:'Playfair Display',serif;font-weight:400;font-size:32px;letter-spacing:.06em;}
.logo h1 span{color:#E8D48A;}
.logo p{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:8px;}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:36px 32px;}
.card h2{font-family:'Playfair Display',serif;font-weight:400;font-size:20px;margin-bottom:6px;}
.card p{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.5);margin-bottom:7px;}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px 16px;color:rgba(255,255,255,.92);font-family:'Jost',sans-serif;font-size:14px;transition:border-color .2s;}
input:focus{outline:none;border-color:#A78BFA;}
.btn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#C9A84C 0%,#E8D48A 50%,#C9A84C 100%);color:#1a1030;font-weight:500;font-size:14px;letter-spacing:.06em;cursor:pointer;margin-top:8px;font-family:'Jost',sans-serif;box-shadow:0 6px 20px rgba(201,168,76,.3);}
.btn:disabled{opacity:.5;cursor:default;}
.msg{border-radius:9px;padding:11px 14px;font-size:13px;margin-top:14px;display:none;}
.msg.error{background:rgba(240,153,123,.12);border:1px solid rgba(240,153,123,.3);color:#F0997B;}
.msg.ok{background:rgba(100,220,150,.1);border:1px solid rgba(100,220,150,.3);color:#6ddc96;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>MONTANA<span>.</span></h1>
    <p>CRM Suite</p>
  </div>
  <div class="card">
    <h2>Set new password</h2>
    <p>Choose a strong password for your account</p>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="pw1" placeholder="••••••••" minlength="8">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="pw2" placeholder="••••••••">
    </div>
    <button class="btn" id="btn" onclick="doReset()">Update password</button>
    <div class="msg error" id="err"></div>
    <div class="msg ok" id="ok"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_KEY } from './js/crm-api.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Supabase puts the recovery token in the URL hash
const hash = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
if (hash.type !== 'recovery' || !hash.access_token) {
  document.getElementById('err').textContent = 'Invalid or expired reset link. Ask your admin to send a new one.';
  document.getElementById('err').style.display = 'block';
  document.getElementById('btn').disabled = true;
} else {
  // Set the session from the recovery token
  sb.auth.setSession({ access_token: hash.access_token, refresh_token: hash.refresh_token || '' });
}

window.doReset = async () => {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  const btn = document.getElementById('btn');

  err.style.display = 'none'; ok.style.display = 'none';

  if (pw1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
  if (pw1 !== pw2)    { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Updating…';
  const { error } = await sb.auth.updateUser({ password: pw1 });
  if (error) {
    err.textContent = error.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Update password';
  } else {
    ok.textContent = 'Password updated! Redirecting to login…'; ok.style.display = 'block';
    await sb.auth.signOut();
    setTimeout(() => location.href = '/crm/', 2000);
  }
};
</script>
</body>
</html>
