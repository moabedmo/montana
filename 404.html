<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Montana | الصفحة غير موجودة</title>
    <meta name="description" content="الصفحة التي تبحث عنها غير موجودة. تصفّح متجر Montana للعناية بالبشرة.">
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/shop.bundle.css?v=2">
    <style>
        .err-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #342f44; color: #f5f0fa; text-align: center; }
        .err-box { max-width: 480px; }
        .err-code { font-size: 72px; font-weight: 900; color: #c9a84c; line-height: 1; margin-bottom: 8px; }
        .err-box h1 { font-size: 22px; margin-bottom: 12px; }
        .err-box p { color: rgba(245,240,250,.7); line-height: 1.8; margin-bottom: 24px; }
        .err-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .err-links a { padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px; }
        .err-primary { background: linear-gradient(135deg, #c9a84c, #9b6cb8); color: #342f44; }
        .err-secondary { border: 1px solid rgba(201,168,76,.35); color: #f5f0fa; }
    </style>
</head>
<body>
<div class="err-page">
    <div class="err-box">
        <div class="err-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>ربما تم نقل الرابط أو حذف الصفحة. جرّب أحد الروابط التالية للعودة إلى متجر Montana.</p>
        <div class="err-links">
            <a href="/" class="err-primary">الرئيسية</a>
            <a href="/category.html" class="err-secondary">المتجر</a>
            <a href="/contact.html" class="err-secondary">تواصل معنا</a>
            <a href="/en/" class="err-secondary">English</a>
        </div>
    </div>
</div>
<script src="/js/analytics-config.js"></script>
<script src="/js/analytics.js" defer></script>
</body>
</html>
